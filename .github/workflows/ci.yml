name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # The same bundle consumers get: a clean build plus the regression suite.
      - run: npm run verify
